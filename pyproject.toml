[project]
name = "ai-healthcare-tracker"
version = "0.1.0"
description = "Contactless breathing monitor from ESP32 Wi-Fi CSI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyserial>=3.5",
    "scipy>=1.11",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
